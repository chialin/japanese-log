<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>看圖猜詞 · 單字小測驗</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
:root{--paper:#fdf6f0;--paper-deep:#f5e8d8;--ink:#2a1810;--ink-soft:#4a3020;--ink-mute:#8a6040;--accent:#c96830;--accent-soft:#f0b48a;--accent-pale:#fce8d8;--line:#f0d0b8;--bg-spot-1:#fdf0e5;--bg-spot-2:#f8e0c8;}

  /* 進度 + 計分 */
  .quiz-bar{display:flex;justify-content:space-between;align-items:center;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink-mute);letter-spacing:.1em;font-size:15px;margin-bottom:8px;}
  .quiz-bar .score{color:var(--accent);}
  .progress{height:4px;background:var(--accent-pale);border-radius:2px;overflow:hidden;margin-bottom:28px;}
  .progress-fill{height:100%;background:var(--accent);width:0;transition:width .3s ease;}

  /* 圖卡 */
  .emoji-card{background:rgba(255,255,255,.6);border:1px solid var(--line);border-top:3px solid var(--accent);padding:36px 24px 28px;text-align:center;margin-bottom:8px;}
  .emoji-big{font-size:clamp(80px,18vw,120px);line-height:1;}
  .emoji-prompt{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink-mute);letter-spacing:.12em;font-size:14px;margin-top:14px;}

  /* 揭曉區（答對後顯示讀音/意思） */
  .reveal{min-height:64px;text-align:center;margin:14px 0 20px;}
  .reveal .kanji{font-family:'Shippori Mincho',serif;font-size:40px;font-weight:800;color:var(--ink);letter-spacing:.05em;}
  .reveal .reading{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:600;color:var(--accent);letter-spacing:.05em;}
  .reveal .romaji{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--accent);letter-spacing:.08em;}
  .reveal .meaning{font-size:15px;color:var(--ink-mute);margin-top:4px;}
  .reveal.hidden{visibility:hidden;}

  /* 選項 */
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .choice{background:rgba(255,255,255,.7);border:1px solid var(--line);padding:18px 14px;text-align:center;cursor:pointer;transition:all .15s;font-family:inherit;}
  .choice:hover{border-color:var(--accent-soft);background:var(--bg-spot-1);}
  .choice .c-kana-main{font-family:'Shippori Mincho',serif;font-size:30px;font-weight:700;color:var(--ink);letter-spacing:.06em;}
  .choice .c-kanji-reveal{font-size:15px;color:var(--ink-mute);margin-top:6px;letter-spacing:.06em;min-height:18px;}
  .choice.correct{border-color:#5a8a4a;background:#e8f3e0;}
  .choice.correct .c-kana-main{color:#3a6a2a;}
  .choice.correct .c-kanji-reveal{color:#3a6a2a;}
  .choice.wrong{border-color:#c05050;background:#f8e6e6;}
  .choice.wrong .c-kana-main{color:#a03030;}
  .choice:disabled{cursor:default;}

  /* 控制列 */
  .quiz-controls{margin-top:24px;text-align:center;}
  .next-btn{display:inline-block;background:var(--accent);color:#fff;border:none;padding:13px 32px;font-family:'Shippori Mincho',serif;font-size:15px;letter-spacing:.1em;cursor:pointer;transition:background .15s;}
  .next-btn:hover{background:var(--ink);}
  .next-btn:disabled{opacity:.35;cursor:default;}

  /* 結算 */
  .result{text-align:center;padding:20px 0;}
  .result .big{font-family:'Shippori Mincho',serif;font-size:56px;font-weight:800;color:var(--accent);}
  .result .msg{font-size:16px;color:var(--ink-soft);margin:10px 0 24px;line-height:1.8;}
  .hidden{display:none;}
  @media(max-width:600px){.choice .c-ja{font-size:26px;}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<div class="wrap">

  <a href="index.html" class="back-link">← 返回 学習日誌</a>

  <header class="masthead">
    <div class="left">れんしゅう · Practice</div>
    <div class="center">看 図 猜 詞</div>
    <div class="right">N5 · 単語</div>
  </header>

  <h1 class="page-title">看圖猜<span class="accent">詞</span></h1>
  <p class="page-subtitle">看 emoji 選出正確的日文單字 · 答對會唸給你聽 🔊</p>

  <div class="speed-control">
    <label for="rate">播放速度</label>
    <input type="range" id="rate" min="0.5" max="1.2" step="0.1" value="0.8">
    <span class="speed-value" id="rateValue">0.8x</span>
  </div>

  <!-- 測驗區 -->
  <div id="quiz">
    <div class="quiz-bar">
      <span id="progressLabel">第 1 / 20 題</span>
      <span class="score">答對 <span id="scoreNum">0</span></span>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

    <div class="emoji-card">
      <div class="emoji-big" id="emoji">🐕</div>
      <div class="emoji-prompt">— 這是什麼？選出對應的日文 —</div>
    </div>

    <div class="reveal hidden" id="reveal">
      <div class="kanji" id="revealKanji"></div>
      <div class="reading" id="revealReading"></div>
      <div class="romaji" id="revealRomaji"></div>
      <div class="meaning" id="revealMeaning"></div>
    </div>

    <div class="choices" id="choices"></div>

    <div class="quiz-controls">
      <button class="next-btn" id="nextBtn" disabled>下一題 →</button>
    </div>
  </div>

  <!-- 給 scripts/generate-audio.mjs 掃描用：列出所有單字讀音以預生 VOICEVOX mp3。
       JTalk.speak(讀音) 會優先找 audio/<hash>.mp3，找不到才 fallback 到 speechSynthesis。
       跑 `node scripts/generate-audio.mjs` 後硬重整即可聽到真人女聲。 -->
  <div hidden aria-hidden="true">
    <span data-text="いぬ"></span><span data-text="ねこ"></span><span data-text="みず"></span><span data-text="ほん"></span><span data-text="くるま"></span><span data-text="さかな"></span><span data-text="はな"></span><span data-text="やま"></span><span data-text="かわ"></span><span data-text="き"></span><span data-text="がっこう"></span><span data-text="えき"></span><span data-text="でんしゃ"></span><span data-text="かさ"></span><span data-text="とけい"></span><span data-text="おかね"></span><span data-text="かぎ"></span><span data-text="さいふ"></span><span data-text="たべもの"></span><span data-text="のみもの"></span>
  </div>

  <!-- 結算區 -->
  <div id="result" class="result hidden">
    <div class="big" id="resultScore">0 / 20</div>
    <div class="msg" id="resultMsg"></div>
    <button class="next-btn" id="restartBtn">↺ 再來一輪</button>
  </div>

</div>

<script src="js/tts.js"></script>
<script>
  // ── 單字資料（emoji / 漢字 / 假名讀音 / 羅馬 / 中文）──
  // data-text 用假名讀音，VOICEVOX 與 fallback 都讀得準。
  const WORDS = [
    { emoji:'🐕', ja:'犬',     kana:'いぬ',     romaji:'inu',      cn:'狗' },
    { emoji:'🐈', ja:'猫',     kana:'ねこ',     romaji:'neko',     cn:'貓' },
    { emoji:'💧', ja:'水',     kana:'みず',     romaji:'mizu',     cn:'水' },
    { emoji:'📖', ja:'本',     kana:'ほん',     romaji:'hon',      cn:'書' },
    { emoji:'🚗', ja:'車',     kana:'くるま',   romaji:'kuruma',   cn:'車子' },
    { emoji:'🐟', ja:'魚',     kana:'さかな',   romaji:'sakana',   cn:'魚' },
    { emoji:'🌸', ja:'花',     kana:'はな',     romaji:'hana',     cn:'花' },
    { emoji:'⛰️', ja:'山',     kana:'やま',     romaji:'yama',     cn:'山' },
    { emoji:'🏞️', ja:'川',     kana:'かわ',     romaji:'kawa',     cn:'河川' },
    { emoji:'🌳', ja:'木',     kana:'き',       romaji:'ki',       cn:'樹木' },
    { emoji:'🏫', ja:'学校',   kana:'がっこう', romaji:'gakkou',   cn:'學校' },
    { emoji:'🚉', ja:'駅',     kana:'えき',     romaji:'eki',      cn:'車站' },
    { emoji:'🚃', ja:'電車',   kana:'でんしゃ', romaji:'densha',   cn:'電車' },
    { emoji:'☂️', ja:'傘',     kana:'かさ',     romaji:'kasa',     cn:'雨傘' },
    { emoji:'⏰', ja:'時計',   kana:'とけい',   romaji:'tokei',    cn:'時鐘' },
    { emoji:'💰', ja:'お金',   kana:'おかね',   romaji:'okane',    cn:'錢' },
    { emoji:'🔑', ja:'鍵',     kana:'かぎ',     romaji:'kagi',     cn:'鑰匙' },
    { emoji:'👛', ja:'財布',   kana:'さいふ',   romaji:'saifu',    cn:'錢包' },
    { emoji:'🍱', ja:'食べ物', kana:'たべもの', romaji:'tabemono', cn:'食物' },
    { emoji:'🥤', ja:'飲み物', kana:'のみもの', romaji:'nomimono', cn:'飲料' },
  ];

  const shuffle = a => { const x=a.slice(); for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];} return x; };
  const rate = () => parseFloat(document.getElementById('rate').value || 0.8);

  let order = [], idx = 0, score = 0, answered = false;

  const $ = id => document.getElementById(id);
  $('rate').addEventListener('input', () => { $('rateValue').textContent = $('rate').value + 'x'; });

  function startQuiz() {
    order = shuffle(WORDS);
    idx = 0; score = 0;
    $('result').classList.add('hidden');
    $('quiz').classList.remove('hidden');
    $('scoreNum').textContent = '0';
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const q = order[idx];
    $('emoji').textContent = q.emoji;
    $('progressLabel').textContent = `第 ${idx + 1} / ${order.length} 題`;
    $('progressFill').style.width = (idx / order.length * 100) + '%';
    $('reveal').classList.add('hidden');
    $('nextBtn').disabled = true;

    // 三個干擾選項 + 正解，洗牌
    const distractors = shuffle(WORDS.filter(w => w.ja !== q.ja)).slice(0, 3);
    const opts = shuffle([q, ...distractors]);

    const box = $('choices');
    box.innerHTML = '';
    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.dataset.kanji = opt.ja;
      // 選項只顯示假名（讀音），逼你認讀音；漢字答題後才揭曉
      btn.innerHTML = `<div class="c-kana-main">${opt.kana}</div><div class="c-kanji-reveal"></div>`;
      btn.onclick = () => choose(btn, opt, q);
      box.appendChild(btn);
    });
  }

  function choose(btn, opt, q) {
    if (answered) return;
    answered = true;
    const correct = opt.ja === q.ja;

    // 標記所有選項 + 揭曉每個選項的漢字
    document.querySelectorAll('.choice').forEach(b => {
      b.disabled = true;
      b.querySelector('.c-kanji-reveal').textContent = b.dataset.kanji;
      if (b.dataset.kanji === q.ja) b.classList.add('correct');
    });
    if (!correct) btn.classList.add('wrong');
    else score++;

    $('scoreNum').textContent = score;

    // 揭曉漢字/讀音/意思 + 唸正解
    $('revealKanji').textContent = q.ja;
    $('revealReading').textContent = q.kana;
    $('revealRomaji').textContent = q.romaji;
    $('revealMeaning').textContent = q.cn;
    $('reveal').classList.remove('hidden');
    JTalk.speak(q.kana, null, { rate: rate() });

    $('progressFill').style.width = ((idx + 1) / order.length * 100) + '%';
    $('nextBtn').disabled = false;
  }

  $('nextBtn').onclick = () => {
    idx++;
    if (idx >= order.length) showResult();
    else renderQuestion();
  };

  function showResult() {
    $('quiz').classList.add('hidden');
    $('result').classList.remove('hidden');
    const total = order.length;
    $('resultScore').textContent = `${score} / ${total}`;
    const pct = score / total;
    let msg;
    if (pct === 1)      msg = '満点！すごい！全部答對 🎉';
    else if (pct >= 0.8) msg = 'よくできました！很棒，再刷一輪鞏固一下。';
    else if (pct >= 0.5) msg = 'いいペース！把答錯的字回 Anki 多複習幾次。';
    else                 msg = 'まだまだ！沒關係，多看圖多聽，下一輪一定進步 💪';
    $('resultMsg').textContent = msg;
  }

  $('restartBtn').onclick = startQuiz;

  startQuiz();
</script>
</body>
</html>
